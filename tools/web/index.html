<!doctype html>
<meta charset="utf-8">
<title>Rocky Voice Input 本机验收</title>
<style>
body{font:18px system-ui;background:#111827;color:#e5e7eb;max-width:900px;margin:48px auto;padding:24px}
textarea{width:100%;height:280px;box-sizing:border-box;background:#1f2937;color:#fff;border:1px solid #6b7280;border-radius:8px;padding:20px;font:20px system-ui}
p{line-height:1.8}code{color:#93c5fd}
</style>
<h1>Rocky Voice Input · 本机测试</h1>
<p>此页面无外部资源、无上传功能。点击输入框，按住 <code>CapsLock</code> 说话，松开后等待文字出现。</p>
<textarea id="dictation" autofocus aria-label="语音输入验收文本框" placeholder="在这里测试中文和 English 技术词"></textarea>
<p id="count">输入字符：0</p>
<script>dictation.addEventListener('input',()=>count.textContent='输入字符：'+dictation.value.length)</script>
